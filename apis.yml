aid: liquilens
name: LIQUILENS PRIVATE LIMITED -- LiquiLens financial research APIs
image: https://liquilens.in/share.png?v=b4962f8b5a592bb2
description: LiquiLens Private Limited provides a financial research API platform that aggregates bank evidence, funding data, market liquidity,
  and source availability across multiple datasets. The service offers public read access without API keys, delivering up to five rows per example
  query for quick inspection. It integrates with tools like Postman, Bruno, and Insomnia, and supports data export via OpenAPI 3.1. Updated October
  2026, LiquiLens aims to facilitate transparent financial data research and analysis.
