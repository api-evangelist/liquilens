openapi: 3.2.0
info:
  title: Financial Evidence for OpenBB Packet API
  description: Seven source-cited datasets, Workspace widgets and read-only MCP. No API key required.
  version: 1.1.3
servers:
- url: /openbb
tags:
- name: Packet
paths:
  /api/v1/packet:
    get:
      summary: Packet
      description: 'Fetch original documents: up to 4 MiB for the money-market atlas, 1 MiB for other sources.'
      operationId: packet_api_v1_packet_get
      parameters:
      - name: topics
        in: query
        required: true
        schema:
          type: string
          maxLength: 150
          title: Topics
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Packet Api V1 Packet Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Packet
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
