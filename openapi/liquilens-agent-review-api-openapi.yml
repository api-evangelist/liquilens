openapi: 3.2.0
info:
  title: Financial Evidence for OpenBB Agent Review API
  description: Seven source-cited datasets, Workspace widgets and read-only MCP. No API key required.
  version: 1.1.3
servers:
- url: /openbb
tags:
- name: Agent Review
paths:
  /api/v1/agent-review:
    get:
      summary: Agent Review
      description: Seiche funding, LiquiLens bank research and Undertow liquidity; no trade decision.
      operationId: agent_review_api_v1_agent_review_get
      parameters:
      - name: bank
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          default: ''
          title: Bank
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 25
          minimum: 1
          default: 10
          title: Limit
      - name: previous_revision
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
          pattern: ^(?:[0-9a-f]{64})?$
          default: ''
          title: Previous Revision
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Agent Review Api V1 Agent Review Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Agent Review
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
